<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>إدارة أسعار المنتجات</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #f3f4f6;
            font-family: Arial, Tahoma, sans-serif;
            color: #222;
        }

        .container {
            width: 95%;
            max-width: 1000px;
            margin: 30px auto;
        }

        .card {
            background: #fff;
            border-radius: 18px;
            padding: 25px;
            box-shadow: 0 8px 30px rgba(0,0,0,.08);
        }

        #loginPage {
            max-width: 500px;
            margin: 100px auto;
        }

        .header {
            text-align: center;
            margin-bottom: 25px;
        }

        .icon {
            font-size: 45px;
        }

        h1 {
            margin: 8px 0;
        }

        .subtitle {
            color: #777;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
        }

        input,
        select {
            width: 100%;
            padding: 13px;
            border: 1px solid #ddd;
            border-radius: 10px;
            font-size: 16px;
            outline: none;
            background: white;
        }

        input:focus,
        select:focus {
            border-color: #222;
        }

        button {
            border: none;
            border-radius: 10px;
            padding: 11px 16px;
            cursor: pointer;
            font-size: 15px;
            font-weight: bold;
        }

        .login-button {
            width: 100%;
            background: #222;
            color: white;
            margin-top: 5px;
        }

        .login-button:disabled {
            opacity: .6;
            cursor: wait;
        }

        #dashboard {
            display: none;
        }

        .controls {
            display: grid;
            grid-template-columns: 1fr 2fr;
            gap: 15px;
            margin-bottom: 20px;
        }

        .table-header {
            display: grid;
            grid-template-columns: 1fr 180px;
            background: #222;
            color: white;
            padding: 14px;
            border-radius: 10px 10px 0 0;
            font-weight: bold;
        }

        .product-row {
            display: grid;
            grid-template-columns: 1fr 180px;
            align-items: center;
            border-bottom: 1px solid #eee;
            padding: 10px 14px;
            min-height: 58px;
        }

        .product-row:hover {
            background: #fafafa;
        }

        .product-name {
            font-size: 15px;
            padding-left: 10px;
        }

        .price-button {
            width: 100%;
            background: #f1f1f1;
            border: 1px solid #ddd;
            color: #222;
        }

        .price-button:hover {
            background: #e5e5e5;
        }

        .edit-box {
            display: flex;
            gap: 5px;
        }

        .edit-box input {
            min-width: 0;
            text-align: center;
            direction: ltr;
            padding: 9px;
        }

        .save-button {
            background: #222;
            color: white;
        }

        .cancel-button {
            background: #eee;
            color: #333;
        }

        .message {
            display: none;
            padding: 12px;
            border-radius: 10px;
            margin: 15px 0;
            text-align: center;
        }

        .success {
            display: block;
            background: #e8f7ee;
            color: #187a43;
        }

        .error {
            display: block;
            background: #fdecec;
            color: #b42318;
        }

        .loading,
        .empty {
            text-align: center;
            padding: 35px;
            color: #777;
        }

        .count {
            color: #777;
            font-size: 13px;
            margin-bottom: 10px;
        }

        .logout {
            margin-top: 20px;
            background: #eee;
        }

        @media (max-width: 650px) {

            .container {
                width: 96%;
                margin: 15px auto;
            }

            .card {
                padding: 15px;
            }

            .controls {
                grid-template-columns: 1fr;
            }

            .table-header {
                grid-template-columns: 1fr 120px;
            }

            .product-row {
                grid-template-columns: 1fr 120px;
            }

            .product-name {
                font-size: 13px;
            }

            .edit-box {
                flex-direction: column;
            }

        }

    </style>

</head>


<body>


<!-- =========================
     LOGIN
========================= -->

<div id="loginPage" class="card">

    <div class="header">

        <div class="icon">🔐</div>

        <h1>
            إدارة أسعار المنتجات
        </h1>

        <div class="subtitle">
            تسجيل الدخول
        </div>

    </div>


    <label for="password">
        كلمة المرور
    </label>

    <input
        id="password"
        type="password"
        placeholder="أدخل كلمة المرور"
    >

    <button
        id="loginButton"
        class="login-button"
        onclick="login()"
    >
        دخول
    </button>


    <div
        id="loginMessage"
        class="message"
    ></div>

</div>



<!-- =========================
     DASHBOARD
========================= -->

<div
    id="dashboard"
    class="container"
>

    <div class="card">

        <div class="header">

            <div class="icon">💰</div>

            <h1>
                إدارة أسعار المنتجات
            </h1>

            <div class="subtitle">
                اضغط على السعر لتعديله
            </div>

        </div>


        <div class="controls">

            <div>

                <label>
                    المجموعة
                </label>

                <select
                    id="sheetSelect"
                    onchange="loadItems()"
                >

                    <option value="">
                        اختر المجموعة
                    </option>

                </select>

            </div>


            <div>

                <label>
                    البحث عن صنف
                </label>

                <input
                    id="searchInput"
                    type="text"
                    placeholder="اكتب اسم الصنف..."
                    oninput="filterItems()"
                >

            </div>

        </div>


        <div
            id="count"
            class="count"
        ></div>


        <div
            id="message"
            class="message"
        ></div>


        <div class="table">

            <div class="table-header">

                <div>
                    اسم الصنف
                </div>

                <div>
                    السعر
                </div>

            </div>


            <div id="itemsContainer">

                <div class="empty">
                    اختر المجموعة لعرض المنتجات
                </div>

            </div>

        </div>


        <button
            class="logout"
            onclick="logout()"
        >
            تسجيل الخروج
        </button>

    </div>

</div>



<script>


/* ==================================================
   رابط Google Apps Script الجديد
================================================== */

const API_URL =
"https://script.google.com/macros/s/AKfycbxtON2C_v_0n46rffVnWpmAxn1i4vhFbuy8vIUMqvJPeLqhiaeO1WGPG3yfi6dZJb7U/exec";


/* ==================================================
   كلمة المرور
================================================== */

let password = "";

let allItems = [];


/* ==================================================
   تسجيل الدخول
================================================== */

async function login() {

    const input =
        document.getElementById("password")
        .value
        .trim();

    const button =
        document.getElementById("loginButton");


    if (!input) {

        showMessage(
            "loginMessage",
            "اكتب كلمة المرور أولاً",
            "error"
        );

        return;
    }


    password = input;

    button.disabled = true;

    button.textContent =
        "جاري الاتصال...";


    try {

        /*
        نستخدم GET بدل POST
        */

        const url =
            API_URL +
            "?action=getSheets" +
            "&password=" +
            encodeURIComponent(password);


        const response =
            await fetch(
                url,
                {
                    method: "GET"
                }
            );


        if (!response.ok) {

            throw new Error(
                "HTTP " + response.status
            );

        }


        const result =
            await response.json();


        if (
            !result ||
            result.status !== "success"
        ) {

            password = "";

            showMessage(
                "loginMessage",
                result?.message ||
                "كلمة المرور غير صحيحة",
                "error"
            );

            return;
        }


        /*
        إخفاء الدخول
        */

        document.getElementById(
            "loginPage"
        ).style.display = "none";


        /*
        إظهار لوحة التحكم
        */

        document.getElementById(
            "dashboard"
        ).style.display = "block";


        /*
        تحميل المجموعات
        */

        const select =
            document.getElementById(
                "sheetSelect"
            );


        select.innerHTML =
            '<option value="">اختر المجموعة</option>';


        result.sheets.forEach(
            function(sheetName) {

                const option =
                    document.createElement(
                        "option"
                    );


                option.value =
                    sheetName;


                option.textContent =
                    sheetName;


                select.appendChild(
                    option
                );

            }
        );


    }
    catch (error) {

        console.error(error);

        password = "";

        showMessage(
            "loginMessage",
            "تعذر الاتصال بـ Google Sheets",
            "error"
        );

    }
    finally {

        button.disabled = false;

        button.textContent = "دخول";

    }

}


/* ==================================================
   تحميل المنتجات
================================================== */

async function loadItems() {

    const sheetName =
        document.getElementById(
            "sheetSelect"
        ).value;


    const container =
        document.getElementById(
            "itemsContainer"
        );


    if (!sheetName) {

        container.innerHTML =
            '<div class="empty">' +
            'اختر المجموعة لعرض المنتجات' +
            '</div>';

        document.getElementById(
            "count"
        ).textContent = "";

        return;
    }


    container.innerHTML =
        '<div class="loading">' +
        'جاري تحميل المنتجات...' +
        '</div>';


    try {

        const url =
            API_URL +
            "?action=getItems" +
            "&password=" +
            encodeURIComponent(password) +
            "&sheetName=" +
            encodeURIComponent(sheetName);


        const response =
            await fetch(url);


        if (!response.ok) {

            throw new Error(
                "HTTP " + response.status
            );

        }


        const result =
            await response.json();


        if (
            !result ||
            result.status !== "success"
        ) {

            container.innerHTML =
                '<div class="empty">' +
                (
                    result?.message ||
                    "فشل تحميل المنتجات"
                ) +
                '</div>';

            return;
        }


        allItems =
            result.items || [];


        displayItems(allItems);


    }
    catch (error) {

        console.error(error);


        container.innerHTML =
            '<div class="empty">' +
            'تعذر تحميل المنتجات' +
            '</div>';

    }

}


/* ==================================================
   عرض المنتجات
================================================== */

function displayItems(items) {

    const container =
        document.getElementById(
            "itemsContainer"
        );


    const count =
        document.getElementById(
            "count"
        );


    if (
        !items ||
        items.length === 0
    ) {

        container.innerHTML =
            '<div class="empty">' +
            'لا توجد منتجات' +
            '</div>';

        count.textContent =
            "عدد المنتجات: 0";

        return;
    }


    count.textContent =
        "عدد المنتجات: " +
        items.length;


    container.innerHTML = "";


    items.forEach(
        function(item, index) {


            const row =
                document.createElement(
                    "div"
                );


            row.className =
                "product-row";


            const name =
                document.createElement(
                    "div"
                );


            name.className =
                "product-name";


            name.textContent =
                item.name;


            const price =
                document.createElement(
                    "div"
                );


            price.innerHTML = `

                <button
                    class="price-button"
                    onclick="editPrice(${index})"
                >
                    ${formatPrice(item.price)}
                </button>

            `;


            row.appendChild(name);

            row.appendChild(price);

            container.appendChild(row);

        }
    );

}


/* ==================================================
   تعديل السعر
================================================== */

function editPrice(index) {

    const item =
        allItems[index];


    const rows =
        document.querySelectorAll(
            ".product-row"
        );


    const row =
        rows[index];


    if (!row) {
        return;
    }


    const priceCell =
        row.children[1];


    priceCell.innerHTML = `

        <div class="edit-box">

            <input
                id="price-${index}"
                type="number"
                min="0"
                step="0.01"
                value="${item.price ?? ""}"
            >

            <button
                class="save-button"
                onclick="savePrice(${index})"
            >
                حفظ
            </button>

            <button
                class="cancel-button"
                onclick="displayItems(allItems)"
            >
                إلغاء
            </button>

        </div>

    `;


    const input =
        document.getElementById(
            "price-" + index
        );


    input.focus();

    input.select();


    input.addEventListener(
        "keydown",
        function(event) {

            if (event.key === "Enter") {

                savePrice(index);

            }

            if (event.key === "Escape") {

                displayItems(allItems);

            }

        }
    );

}


/* ==================================================
   حفظ السعر
================================================== */

async function savePrice(index) {

    const item =
        allItems[index];


    const input =
        document.getElementById(
            "price-" + index
        );


    const newPrice =
        input.value.trim();


    if (
        newPrice === "" ||
        isNaN(Number(newPrice)) ||
        Number(newPrice) < 0
    ) {

        showMessage(
            "message",
            "أدخل سعرًا صحيحًا",
            "error"
        );

        return;
    }


    const sheetName =
        document.getElementById(
            "sheetSelect"
        ).value;


    try {

        showMessage(
            "message",
            "جاري حفظ السعر...",
            "success"
        );


        /*
        نرسل POST لتعديل السعر
        */

        const response =
            await fetch(
                API_URL,
                {
                    method: "POST",

                    headers: {
                        "Content-Type":
                            "text/plain;charset=utf-8"
                    },

                    body:
                        JSON.stringify({

                            action:
                                "updatePrice",

                            password:
                                password,

                            sheetName:
                                sheetName,

                            itemName:
                                item.name,

                            newPrice:
                                Number(newPrice)

                        })
                }
            );


        const result =
            await response.json();


        if (
            result &&
            result.status === "success"
        ) {

            item.price =
                Number(newPrice);


            displayItems(allItems);


            showMessage(
                "message",
                "تم تحديث السعر بنجاح ✅",
                "success"
            );

        }
        else {

            showMessage(
                "message",
                result?.message ||
                "فشل تحديث السعر",
                "error"
            );

        }

    }
    catch (error) {

        console.error(error);


        showMessage(
            "message",
            "تعذر حفظ السعر",
            "error"
        );

    }

}


/* ==================================================
   البحث
================================================== */

function filterItems() {

    const search =
        document.getElementById(
            "searchInput"
        )
        .value
        .trim()
        .toLowerCase();


    if (!search) {

        displayItems(allItems);

        return;
    }


    const filtered =
        allItems.filter(
            function(item) {

                return String(item.name)
                    .toLowerCase()
                    .includes(search);

            }
        );


    displayItems(filtered);

}


/* ==================================================
   تنسيق السعر
================================================== */

function formatPrice(price) {

    if (
        price === null ||
        price === undefined ||
        price === ""
    ) {

        return "0";
    }


    const number =
        Number(price);


    if (isNaN(number)) {

        return price;

    }


    return number.toLocaleString(
        "en-US",
        {
            maximumFractionDigits: 2
        }
    );

}


/* ==================================================
   الرسائل
================================================== */

function showMessage(
    elementId,
    text,
    type
) {

    const element =
        document.getElementById(
            elementId
        );


    element.textContent =
        text;


    element.className =
        "message " + type;

}


/* ==================================================
   تسجيل الخروج
================================================== */

function logout() {

    password = "";

    allItems = [];


    document.getElementById(
        "dashboard"
    ).style.display =
        "none";


    document.getElementById(
        "loginPage"
    ).style.display =
        "block";


    document.getElementById(
        "password"
    ).value = "";


    document.getElementById(
        "sheetSelect"
    ).innerHTML =
        '<option value="">اختر المجموعة</option>';


    document.getElementById(
        "searchInput"
    ).value = "";


    document.getElementById(
        "itemsContainer"
    ).innerHTML =
        '<div class="empty">' +
        'اختر المجموعة لعرض المنتجات' +
        '</div>';


    document.getElementById(
        "count"
    ).textContent = "";

}


/* ==================================================
   Enter للدخول
================================================== */

document
    .getElementById("password")
    .addEventListener(
        "keydown",
        function(event) {

            if (event.key === "Enter") {

                login();

            }

        }
    );

</script>

</body>
</html>
