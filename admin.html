<!DOCTYPE html>

<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>إدارة الأسعار</title>


<style>

* {
    box-sizing: border-box;
}

body {

    margin: 0;

    background: #f3f4f6;

    font-family:
        Arial,
        Tahoma,
        sans-serif;

    color: #222;

}


/* =========================
   الحاوية
========================= */

.container {

    width: 95%;

    max-width: 1000px;

    margin: 30px auto;

}


/* =========================
   الكروت
========================= */

.card {

    background: white;

    border-radius: 18px;

    padding: 25px;

    box-shadow:
        0 8px 30px rgba(0,0,0,0.08);

}


/* =========================
   العنوان
========================= */

.header {

    text-align: center;

    margin-bottom: 25px;

}


.header-icon {

    font-size: 45px;

    margin-bottom: 5px;

}


.header h1 {

    margin: 0;

    font-size: 27px;

}


.header p {

    color: #777;

    margin-top: 8px;

}


/* =========================
   تسجيل الدخول
========================= */

#loginPage {

    max-width: 500px;

    margin: 100px auto;

}


input,
select {

    width: 100%;

    padding: 13px;

    border: 1px solid #ddd;

    border-radius: 10px;

    font-size: 16px;

    outline: none;

}


input:focus,
select:focus {

    border-color: #333;

}


label {

    display: block;

    margin-bottom: 7px;

    font-weight: bold;

}


.form-group {

    margin-bottom: 18px;

}


button {

    border: none;

    border-radius: 10px;

    padding: 12px 18px;

    cursor: pointer;

    font-size: 15px;

    font-weight: bold;

}


.login-button {

    width: 100%;

    background: #222;

    color: white;

}


.login-button:hover {

    background: #000;

}


/* =========================
   لوحة التحكم
========================= */

#dashboard {

    display: none;

}


.controls {

    display: grid;

    grid-template-columns: 1fr 2fr;

    gap: 15px;

    margin-bottom: 20px;

}


.search {

    direction: rtl;

}


/* =========================
   جدول المنتجات
========================= */

.table {

    width: 100%;

}


.table-header {

    display: grid;

    grid-template-columns: 1fr 180px;

    background: #222;

    color: white;

    padding: 14px;

    border-radius: 10px 10px 0 0;

    font-weight: bold;

}


.product-row {

    display: grid;

    grid-template-columns: 1fr 180px;

    align-items: center;

    border-bottom: 1px solid #eee;

    padding: 10px 14px;

    min-height: 58px;

}


.product-row:hover {

    background: #fafafa;

}


.product-name {

    font-size: 15px;

    padding-left: 10px;

}


/* =========================
   السعر
========================= */

.price-button {

    width: 100%;

    background: #f1f1f1;

    color: #222;

    border: 1px solid #ddd;

    font-size: 16px;

}


.price-button:hover {

    background: #e7e7e7;

}


/* =========================
   وضع التعديل
========================= */

.price-edit {

    display: flex;

    gap: 6px;

}


.price-edit input {

    width: 100%;

    text-align: center;

    direction: ltr;

    padding: 9px;

}


.save-small {

    background: #222;

    color: white;

    min-width: 65px;

}


.cancel-small {

    background: #eee;

    color: #333;

    min-width: 50px;

}


/* =========================
   الرسائل
========================= */

.message {

    display: none;

    padding: 12px;

    border-radius: 10px;

    margin: 15px 0;

    text-align: center;

}


.success {

    display: block;

    background: #e8f7ee;

    color: #187a43;

}


.error {

    display: block;

    background: #fdecec;

    color: #b42318;

}


/* =========================
   التحميل
========================= */

.loading {

    text-align: center;

    padding: 30px;

    color: #777;

}


/* =========================
   لا توجد نتائج
========================= */

.empty {

    text-align: center;

    padding: 40px;

    color: #777;

}


/* =========================
   تسجيل الخروج
========================= */

.logout {

    margin-top: 20px;

    background: #eee;

    color: #333;

}


/* =========================
   الهاتف
========================= */

@media (max-width: 650px) {

    .container {

        width: 96%;

        margin: 15px auto;

    }


    .card {

        padding: 15px;

    }


    .controls {

        grid-template-columns: 1fr;

    }


    .table-header {

        grid-template-columns: 1fr 130px;

    }


    .product-row {

        grid-template-columns: 1fr 130px;

    }


    .product-name {

        font-size: 13px;

    }

}

</style>

</head>


<body>


<!-- =========================
     تسجيل الدخول
========================= -->

<div id="loginPage" class="card">

    <div class="header">

        <div class="header-icon">
            🔐
        </div>

        <h1>
            لوحة إدارة الأسعار
        </h1>

        <p>
            تسجيل الدخول
        </p>

    </div>


    <div class="form-group">

        <label>
            كلمة المرور
        </label>

        <input
            type="password"
            id="password"
            placeholder="أدخل كلمة المرور"
        >

    </div>


    <button
        class="login-button"
        onclick="login()"
    >

        دخول

    </button>


    <div
        id="loginMessage"
        class="message"
    ></div>

</div>



<!-- =========================
     لوحة التحكم
========================= -->

<div
    id="dashboard"
    class="container"
>

    <div class="card">


        <div class="header">

            <div class="header-icon">
                💰
            </div>

            <h1>
                إدارة أسعار المنتجات
            </h1>

            <p>
                اضغط على السعر لتعديله
            </p>

        </div>



        <!-- أدوات التحكم -->

        <div class="controls">


            <div>

                <label>
                    المجموعة
                </label>

                <select
                    id="sheetSelect"
                    onchange="loadItems()"
                >

                    <option value="">
                        اختر المجموعة
                    </option>

                </select>

            </div>



            <div>

                <label>
                    البحث عن صنف
                </label>

                <input
                    type="text"
                    id="searchInput"
                    class="search"
                    placeholder="اكتب اسم الصنف..."
                    oninput="filterItems()"
                >

            </div>


        </div>



        <div
            id="message"
            class="message"
        ></div>



        <!-- جدول المنتجات -->

        <div class="table">


            <div class="table-header">

                <div>
                    اسم الصنف
                </div>

                <div>
                    السعر
                </div>

            </div>


            <div id="itemsContainer">

                <div class="empty">

                    اختر المجموعة لعرض المنتجات

                </div>

            </div>


        </div>



        <button
            class="logout"
            onclick="logout()"
        >

            تسجيل الخروج

        </button>


    </div>

</div>



<script>


/* ========================================
   رابط Apps Script
======================================== */

const API_URL =
"https://script.google.com/macros/s/AKfycbxBIn3qdWSqv5I0amJ-WHYJR8aeFMsEbpPJe42ox4xhevtCeHp46XC0inujKw8ayJb/exec";


/* ========================================
   المتغيرات
======================================== */

let password = "";

let allItems = [];



/* ========================================
   تسجيل الدخول
======================================== */

async function login() {

    const input =
        document.getElementById("password").value.trim();

    if (!input) {

        showMessage(
            "loginMessage",
            "اكتب كلمة المرور أولاً",
            "error"
        );

        return;

    }


    password = input;


    try {

        const result = await sendRequest({

            action: "getSheets",

            password: password

        });


        if (result.status !== "success") {

            showMessage(
                "loginMessage",
                result.message || "فشل تسجيل الدخول",
                "error"
            );

            password = "";

            return;

        }


        /*
         * إخفاء صفحة الدخول
         */

        document.getElementById("loginPage")
            .style.display = "none";


        /*
         * إظهار لوحة التحكم
         */

        document.getElementById("dashboard")
            .style.display = "block";


        /*
         * إضافة الأوراق للقائمة
         */

        const select =
            document.getElementById("sheetSelect");


        select.innerHTML =
            '<option value="">اختر المجموعة</option>';


        result.sheets.forEach(function(sheetName) {

            const option =
                document.createElement("option");

            option.value = sheetName;

            option.textContent = sheetName;

            select.appendChild(option);

        });


    } catch (error) {

        showMessage(
            "loginMessage",
            "تعذر الاتصال بـ Google Sheets",
            "error"
        );

    }

}



/* ========================================
   جلب الأصناف
======================================== */

async function loadItems() {

    const sheetName =
        document.getElementById("sheetSelect").value;


    const container =
        document.getElementById("itemsContainer");


    if (!sheetName) {

        container.innerHTML =
            '<div class="empty">اختر المجموعة لعرض المنتجات</div>';

        return;

    }


    container.innerHTML =
        '<div class="loading">جاري تحميل المنتجات...</div>';


    try {

        const result = await sendRequest({

            action: "getItems",

            password: password,

            sheetName: sheetName

        });


        if (result.status !== "success") {

            container.innerHTML =
                '<div class="empty">' +
                result.message +
                '</div>';

            return;

        }


        allItems = result.items;


        displayItems(allItems);


    } catch (error) {

        container.innerHTML =
            '<div class="empty">حدث خطأ أثناء تحميل المنتجات</div>';

    }

}



/* ========================================
   عرض المنتجات
======================================== */

function displayItems(items) {

    const container =
        document.getElementById("itemsContainer");


    if (!items || items.length === 0) {

        container.innerHTML =
            '<div class="empty">لا توجد منتجات</div>';

        return;

    }


    container.innerHTML = "";


    items.forEach(function(item, index) {


        const row =
            document.createElement("div");


        row.className =
            "product-row";


        row.id =
            "product-" + index;


        /*
         * اسم المنتج
         */

        const name =
            document.createElement("div");


        name.className =
            "product-name";


        name.textContent =
            item.name;


        /*
         * خانة السعر
         */

        const price =
            document.createElement("div");


        price.innerHTML = `

            <button
                class="price-button"
                onclick="editPrice(${index})"
            >

                ${formatPrice(item.price)}

            </button>

        `;


        row.appendChild(name);

        row.appendChild(price);

        container.appendChild(row);

    });

}



/* ========================================
   تعديل السعر
======================================== */

function editPrice(index) {

    const item =
        allItems[index];


    const row =
        document.getElementById(
            "product-" + index
        );


    const priceCell =
        row.children[1];


    priceCell.innerHTML = `

        <div class="price-edit">

            <input
                type="number"
                id="price-input-${index}"
                value="${item.price}"
                step="0.01"
                min="0"
            >

            <button
                class="save-small"
                onclick="savePrice(${index})"
            >
                حفظ
            </button>

            <button
                class="cancel-small"
                onclick="displayItems(allItems)"
            >
                ×
            </button>

        </div>

    `;


    /*
     * وضع المؤشر داخل خانة السعر
     */

    const input =
        document.getElementById(
            "price-input-" + index
        );


    input.focus();

    input.select();

}



/* ========================================
   حفظ السعر
======================================== */

async function savePrice(index) {

    const item =
        allItems[index];


    const input =
        document.getElementById(
            "price-input-" + index
        );


    const newPrice =
        input.value;


    if (
        newPrice === "" ||
        isNaN(Number(newPrice)) ||
        Number(newPrice) < 0
    ) {

        showMessage(
            "message",
            "أدخل سعرًا صحيحًا",
            "error"
        );

        return;

    }


    const sheetName =
        document.getElementById("sheetSelect").value;


    try {

        const result =
            await sendRequest({

                action: "updatePrice",

                password: password,

                sheetName: sheetName,

                itemName: item.name,

                newPrice: Number(newPrice)

            });


        if (result.status === "success") {


            /*
             * تحديث السعر محليًا
             */

            item.price =
                Number(newPrice);


            /*
             * إعادة عرض الصفوف
             */

            displayItems(allItems);


            showMessage(
                "message",
                "تم تحديث سعر " +
                item.name +
                " إلى " +
                formatPrice(newPrice) +
                " بنجاح ✅",
                "success"
            );


        } else {

            showMessage(
                "message",
                result.message ||
                "فشل تحديث السعر",
                "error"
            );

        }


    } catch (error) {

        showMessage(
            "message",
            "حدث خطأ أثناء الاتصال بالخادم",
            "error"
        );

    }

}



/* ========================================
   البحث
======================================== */

function filterItems() {

    const search =
        document
            .getElementById("searchInput")
            .value
            .trim()
            .toLowerCase();


    if (!search) {

        displayItems(allItems);

        return;

    }


    const filtered =
        allItems.filter(function(item) {

            return String(item.name)
                .toLowerCase()
                .includes(search);

        });


    displayItems(filtered);

}



/* ========================================
   إرسال الطلب إلى Apps Script
======================================== */

async function sendRequest(data) {

    const response =
        await fetch(API_URL, {

            method: "POST",

            headers: {

                "Content-Type":
                    "text/plain;charset=utf-8"

            },

            body: JSON.stringify(data)

        });


    return await response.json();

}



/* ========================================
   تنسيق السعر
======================================== */

function formatPrice(price) {

    if (
        price === null ||
        price === undefined ||
        price === ""
    ) {

        return "0";

    }


    const number =
        Number(price);


    if (isNaN(number)) {

        return price;

    }


    return number.toLocaleString("en-US", {

        maximumFractionDigits: 2

    });

}



/* ========================================
   الرسائل
======================================== */

function showMessage(
    elementId,
    text,
    type
) {

    const element =
        document.getElementById(elementId);


    element.textContent = text;


    element.className =
        "message " + type;

}



/* ========================================
   تسجيل الخروج
======================================== */

function logout() {

    password = "";

    allItems = [];


    document.getElementById("dashboard")
        .style.display = "none";


    document.getElementById("loginPage")
        .style.display = "block";


    document.getElementById("password")
        .value = "";


    document.getElementById("sheetSelect")
        .innerHTML =
        '<option value="">اختر المجموعة</option>';


    document.getElementById("itemsContainer")
        .innerHTML =
        '<div class="empty">اختر المجموعة لعرض المنتجات</div>';

}



/* ========================================
   Enter لتسجيل الدخول
======================================== */

document
    .getElementById("password")
    .addEventListener(
        "keydown",
        function(event) {

            if (event.key === "Enter") {

                login();

            }

        }
    );


</script>


</body>

</html>
